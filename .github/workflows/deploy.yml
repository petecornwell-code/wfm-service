name: Deploy

on:
  push:
    branches: [main, claude/create-system-specification-451ge]
    # Planning artifacts cannot change the deployed artifact: the Dockerfile copies
    # only gradlew, gradle/, build.gradle, settings.gradle and src/, and .dockerignore
    # excludes *.md outright. A .planning-only push previously rebuilt the image and
    # rolled ECS — replacing a healthy task to ship a text file.
    #
    # This skips the whole workflow, test gate included, but ONLY when every changed
    # file matches. A push touching .planning AND source still runs in full.
    paths-ignore:
      - '.planning/**'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::982940000233:role/wfm-service-dev-github-actions
  ECR_REPOSITORY: wfm-service
  ECS_CLUSTER: wfm-service-dev
  ECS_SERVICE: wfm-service
  ECS_TASK_FAMILY: wfm-service-dev
  FRONTEND_BUCKET: wfm-service-dev-frontend-982940000233
  # Public origin used by the post-deploy smoke test. Deliberately not derived from
  # the ALB via the AWS API — see the smoke test step for why.
  HEALTH_URL: https://d2bbtcc80peap7.cloudfront.net/actuator/health

jobs:
  # Deploy gate. ci.yml only runs on main and PRs to main, so before this job
  # existed any branch listed in the push trigger above shipped to the live
  # environment with no test run at all.
  test:
    name: Test (deploy gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # `build` = assemble + full unfiltered test suite. Do not narrow this to a
      # filtered run: no test under src/test/java/com/wfm/solver/ loads the Spring
      # context, so a scoped solver-package run cannot detect a broken
      # solverConfig.xml — that exact gap shipped an XSD ordering bug that failed
      # every @SpringBootTest suite.
      - name: Run full test suite
        run: ./gradlew build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-gate-test-results
          path: build/reports/tests/

  deploy-backend:
    name: Deploy Backend
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Captured before anything changes so the rollback step has a known-good
      # target. Must run before "Deploy to ECS" or it records the new revision.
      - name: Capture current task definition for rollback
        id: prev
        run: |
          PREV=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "Current task definition: $PREV"
          echo "arn=$PREV" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update ECS task definition
        id: task-def
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Get current task definition
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $ECS_TASK_FAMILY \
            --query 'taskDefinition' \
            --output json)

          # Update image in container definition
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          # Register new task definition
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition ${{ steps.task-def.outputs.task_definition_arn }} \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      # `services-stable` only proves ECS settled — it says nothing about whether
      # the app can actually serve.
      #
      # Probing goes through the public origin rather than the ALB directly: the
      # deploy role has no elasticloadbalancing:DescribeLoadBalancers permission, so
      # resolving the ALB DNS fails with AccessDenied and — under `bash -e` — aborts
      # the step before the retry loop runs. Every request below is cache-busted with
      # a unique query string and a no-cache header so a stale edge response cannot
      # mask a dead origin; during the 2026-08-13 outage this same probe correctly
      # returned 502/503 rather than a cached 200.
      - name: Smoke test
        run: |
          echo "Probing $HEALTH_URL"

          for i in $(seq 1 30); do
            BODY=$(curl -fsS -m 10 -H 'Cache-Control: no-cache' "$HEALTH_URL?_=$(date +%s)-$i" 2>/dev/null || true)
            # Require the db component explicitly: the app reports status UP while
            # its datasource is unusable, which is how a stale DB credential
            # produced a "successful" deploy in front of a 502.
            if printf '%s' "$BODY" | grep -q '"status":"UP"' \
               && printf '%s' "$BODY" | grep -q '"db":{"status":"UP"'; then
              echo "$BODY"
              echo "Smoke test passed on attempt $i"
              exit 0
            fi
            echo "attempt $i/30: not healthy yet ${BODY:+(response: ${BODY:0:120})}"
            sleep 10
          done

          echo "::error::Smoke test FAILED — service did not report a healthy app+db within 5 minutes"
          exit 1

      # Reverts to the revision captured above when the wait or the smoke test
      # fails. Note this recovers code-caused failures only: if the cause is
      # external (expired DB credential, unreachable dependency) the previous
      # revision fails identically, so the warning below is the real signal.
      - name: Roll back on failed deploy
        if: failure() && steps.prev.outputs.arn != ''
        run: |
          echo "::warning::Deploy failed — rolling back to ${{ steps.prev.outputs.arn }}"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.prev.outputs.arn }}" \
            --force-new-deployment

          if aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"; then
            echo "Rolled back to the previous task definition."
          else
            echo "::error::Rollback did NOT stabilise. The previous revision is failing too, so the \
          cause is almost certainly external to this commit (credentials, database, or a downstream \
          dependency). Check: aws logs tail /ecs/wfm-service-dev --since 15m"
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/ s3://$FRONTEND_BUCKET/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # index.html should not be cached aggressively
          aws s3 cp frontend/dist/index.html s3://$FRONTEND_BUCKET/index.html \
            --cache-control "public, max-age=60"

      - name: Invalidate CloudFront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='wfm-service dev frontend'].Id" \
            --output text)

          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
