plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.wfm'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Timefold Solver
    implementation platform('ai.timefold.solver:timefold-solver-bom:1.16.0')
    implementation 'ai.timefold.solver:timefold-solver-spring-boot-starter'
    implementation 'ai.timefold.solver:timefold-solver-jpa'

    // Apache POI for spreadsheet export
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'ai.timefold.solver:timefold-solver-test'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()

    // 12-03: narrow, single-property passthrough so the seeded A/B benchmark
    // harness (AtomicShiftMoveBenchmarkTest, gated on @EnabledIfSystemProperty)
    // can be opted into via `-Dwfm.benchmark=true` on the Gradle command line.
    // Forwards exactly this one named property to the test JVM — never the
    // whole JVM property set, which would leak every `-D` on the Gradle
    // command line (including credentials) into test output and CI logs.
    systemProperty 'wfm.benchmark', System.getProperty('wfm.benchmark', 'false')
}

tasks.register('generateFteSpreadsheet', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wfm.util.FteSpreadsheetGenerator'
}
