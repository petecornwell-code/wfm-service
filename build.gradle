plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.wfm'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Two separate traps, both of which cost real time to find — leave this pinned.
//
// 1. Spring Boot's dependency-management plugin pins Testcontainers (3.4.2 -> 1.20.4), and that
//    managed version WINS over a platform()/BOM declaration in `dependencies`, SILENTLY. Without
//    this line the build appears to use the requested version while the test JVM logs
//    "Testcontainers version: 1.20.4". `ext` is the only place the plugin honours.
//
// 2. The version floor is 1.21.4 for Docker 29 support. Docker 29 dropped every Engine API version
//    below v1.40 (/v1.39/info answers 400, /v1.40 answers 200), and Testcontainers <= 1.21.3
//    negotiates an older default, so EVERY client strategy fails with
//    "BadRequestException (Status 400)". Testcontainers then reports "Could not find a valid Docker
//    environment" on a machine where `docker info` works perfectly — and because
//    PostgresBackedTest sets disabledWithoutDocker = true, that surfaces as a silent SKIP rather
//    than a failure. Neither DOCKER_API_VERSION nor an api.version property overrides it; only the
//    library version does.
ext['testcontainers.version'] = '1.21.4'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Timefold Solver
    implementation platform('ai.timefold.solver:timefold-solver-bom:1.16.0')
    implementation 'ai.timefold.solver:timefold-solver-spring-boot-starter'
    implementation 'ai.timefold.solver:timefold-solver-jpa'

    // Apache POI for spreadsheet export
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'ai.timefold.solver:timefold-solver-test'
    testRuntimeOnly 'com.h2database:h2'

    // Postgres-backed tests. The rest of the suite runs on H2 with ddl-auto: create-drop, which
    // cannot see anything Postgres-specific: it tolerates untyped null parameters (the
    // `lower(bytea)` 500 on GET /agents) and it never executes a Flyway migration, so V40-V43
    // shipped without a single test running them. Tests extending PostgresBackedTest run against
    // a real Postgres with the real migrations applied. See that class for the contract.
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()

    // 15-08: narrow, single-property passthrough so the seeded A/B benchmark harness
    // (ShiftModelBenchmarkTest, gated on @EnabledIfSystemProperty) can be opted into via
    // `-Dwfm.benchmark=true` on the Gradle command line. Forwards exactly this one named
    // property to the test JVM — never the whole JVM property set, which would leak every
    // `-D` on the Gradle command line (including credentials) into test output and CI logs.
    // Re-added after being removed at 299c42c alongside the Phase 12 harness it gated.
    systemProperty 'wfm.benchmark', System.getProperty('wfm.benchmark', 'false')

}

tasks.register('generateFteSpreadsheet', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wfm.util.FteSpreadsheetGenerator'
}
