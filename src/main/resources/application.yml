spring:
  application:
    name: wfm-service

  datasource:
    url: jdbc:postgresql://localhost:5432/wfm
    username: wfm
    password: wfm
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Defensive limit for multi-desk workbooks (one sheet per desk, T-10-04
      # zip-bomb/oversized-upload mitigation) — enforced before Apache POI opens
      # the stream.
      max-file-size: 10MB
      max-request-size: 10MB

# CORS
cors:
  allowed-origins: http://localhost:3000

# BambooHR integration
bamboohr:
  mock: true
  api-key:
  subdomain:
  time-off:
    lookahead-weeks: 8
    lookback-weeks: 12
  http:
    # D-04: the upload-triggered fetch (AgentMergeService.fetchSnapshot) is a whole-tenant
    # call, larger than a single desk's manual refresh, and runs on every upload rather than
    # only when an operator clicks refresh -- these bound it so a hung BambooHR call can no
    # longer hang the upload indefinitely.
    connect-timeout-seconds: 10
    read-timeout-seconds: 120

# Solver
solver:
  time-limit: PT5M
  polling-interval-ms: 2000

# Timefold
timefold:
  solver:
    solver-config-xml: solverConfig.xml

# Logging — solver debug output
logging:
  level:
    ai.timefold.solver.core: INFO
    ai.timefold.solver.core.impl.constructionheuristic: DEBUG
    ai.timefold.solver.core.impl.localsearch: DEBUG
    ai.timefold.solver.core.impl.phase: DEBUG
    ai.timefold.solver.core.impl.solver: DEBUG
    com.wfm.service.SolverService: DEBUG
    com.wfm.solver: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
