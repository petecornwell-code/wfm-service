spring:
  application:
    name: wfm-service

  datasource:
    url: jdbc:postgresql://localhost:5432/wfm
    username: wfm
    password: wfm
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

# CORS
cors:
  allowed-origins: http://localhost:3000

# BambooHR integration
bamboohr:
  mock: true
  api-key:
  subdomain:
  time-off:
    lookahead-weeks: 8

# Solver
solver:
  time-limit: PT5M
  polling-interval-ms: 2000

# Timefold
timefold:
  solver:
    solver-config-xml: solverConfig.xml

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
